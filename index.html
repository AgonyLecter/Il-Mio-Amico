"Hai un aspetto orribile.": "You look awful.",
"Il tuo riflesso sbatte le palpebre un attimo dopo di te.": "Your reflection blinks a moment after you.",
"Riprovi. Ora è perfetto. Troppo perfetto.": "You try again. Now it's perfect. Too perfect.",
"Il riflesso sorride.": "The reflection smiles.",
"Tu no.": "You don't.",
"Sulla spalla del riflesso c'è {N}. Enorme.": "On your reflection's shoulder there's {N}. Huge.",
"Ti saluta. Con una mano. Non gli hai mai visto delle mani.": "It waves at you. With a hand. You've never seen it with hands.",
"Sul vetro appannato qualcuno ha scritto con il dito:": "On the fogged-up glass, someone has written with a finger:",
"Non leggere quella roba, {P}. Sono bugie.": "Don't read that stuff, {P}. It's all lies.",
"Notte.": "Night.",
"Me lo avevi promesso. Non mi hai portato niente.": "You promised me. You didn't bring me anything.",
"Nel sonno senti qualcosa muoversi. Su per il braccio. Verso la spalla.": "In your sleep you feel something moving. Up your arm. Toward your shoulder.",
"Al mattino, il lenzuolo è macchiato di rosso.": "In the morning, the sheet is stained red.",
"Buonanotte. Ti voglio bene.": "Good night. I love you.",
"Dormi male. Ma dormi.": "You sleep badly. But you sleep.",
"Notte. Il settimo giorno finisce.": "Night. The seventh day ends.",
"Fuori, in strada, una macchina si ferma. Poi riparte. Nessuno sale le scale.": "Outside, in the street, a car stops. Then drives off. Nobody comes up the stairs.",
"Ho fame.": "I'm hungry.",
"Ho sempre fame. Lo sai, vero?": "I'm always hungry. You know that, right?",
"Il dolce era poco. La carne era fredda. Il pesce era piccolo.": "The sweets were too little. The meat was cold. The fish was small.",
"Tu invece sei caldo. E sei tanto.": "But you're warm. And there's so much of you.",
"Dammi un dito, {P}. Solo uno.": "Give me a finger, {P}. Just one.",
"Ne hai dieci. Non te ne accorgerai nemmeno.": "You have ten. You won't even notice.",
"Darglielo": "Give it",
"Rifiutare": "Refuse",
"Prendere il coltello": "Grab the knife",
"...Va bene.": "...Okay.",
"Lo sapevo. Sei il mio migliore amico.": "I knew it. You're my best friend.",
"Non fa male quanto pensavi.": "It doesn't hurt as much as you thought.",
"Anzi. Non fa male per niente.": "Actually. It doesn't hurt at all.",
"Ed è proprio questo che ti spaventa.": "And that's exactly what scares you.",
"No. Basta.": "No. Enough.",
"Va bene.": "Okay.",
"Va bene va bene va bene va bene.": "Okay okay okay okay.",
"Ti addormenti senza accorgertene.": "You fall asleep without noticing.",
"Alle 3:33 ti svegli. La mano sinistra è bagnata.": "At 3:33 you wake up. Your left hand is wet.",
"Me lo sono preso da solo. Non arrabbiarti.": "I took it myself. Don't be mad.",
"L'ho fatto per te. Tu non volevi scegliere, vero?": "I did it for you. You didn't want to choose, did you?",
"Il coltello della cucina è freddo. La tua mano trema.": "The kitchen knife is cold. Your hand is shaking.",
"Cosa vuoi fare con quello?": "What are you going to do with that?",
"COLTELLO": "KNIFE",
"Affondi la lama alla base di {N}. Urla. Urli anche tu.": "You sink the blade into the base of {N}. It screams. You scream too.",
"Poi il taglio si richiude da solo. In un attimo.": "Then the cut closes up on its own. In an instant.",
"Come se la tua carne fosse sua.": "As if your flesh were its own.",
"NON. FARLO. MAI. PIÙ.": "DON'T. EVER. DO. THAT. AGAIN.",
"...Ti perdono. Perché siamo amici.": "...I forgive you. Because we're friends.",
"La lama si ferma a un centimetro dalla pelle.": "The blade stops a centimeter from your skin.",
"Non l'hai fermata tu.": "You weren't the one who stopped it.",
"Questa mano ormai è anche mia.": "This hand is mine too, now.",
"E allora... me lo prendo.": "So... I'll just take it.",
"E migliaia di puntini neri. Sui polsi di migliaia di persone.": "And thousands of black dots. On the wrists of thousands of people.",
"Ti stanno guardando tutti.": "They're all looking at you.",
"FINE CAPITOLO 2": "END OF CHAPTER 2",
"Il tuo corpo è diventato troppo piccolo per due.": "Your body has become too small for two.",
"Grazie per il pasto, {P}. Sapevi di casa.": "Thanks for the meal, {P}. You tasted like home.",
"Non sai più dove finisci tu e dove comincia {N}.": "You no longer know where you end and {N} begins.",
"Shh. Adesso siamo una cosa sola.": "Shh. Now we are one.",
"FINE": "THE END",
"FINALE: IL PASTO": "ENDING: THE MEAL",
"FINALE: UNA COSA SOLA": "ENDING: ONE AND THE SAME",
"TORNA AL TITOLO": "BACK TO TITLE",
"RESISTI!": "RESIST!",
"TOCCA IL PIU' VELOCE POSSIBILE": "TAP AS FAST AS YOU CAN",
"Dormi a lungo. Quando ti svegli, le ferite si sono chiuse.": "You sleep for a long time. When you wake up, the wounds have closed.",
"Ti ho riparato io, {P}. Mi servi intero.": "I fixed you, {P}. I need you in one piece.",
"CAPITOLO 3": "CHAPTER 3",
"LA VOCE": "THE VOICE",
"{N} adesso ti arriva quasi al gomito. Le sue radici salgono verso la spalla.": "{N} now reaches almost to your elbow. Its roots are climbing toward your shoulder.",
"Il tuo dito era buonissimo. Lo sento ancora, qui dentro.": "Your finger was delicious. I can still feel it, in here.",
"Ti lavi i denti. Apri la bocca per sputare.": "You brush your teeth. You open your mouth to spit.",
"Buongiorno, {P}.": "Good morning, {P}.",
"Non l'hai detto tu. Ma era la tua voce.": "You didn't say that. But it was your voice.",
"Adesso posso parlare anche con la tua bocca. Bello, vero?": "Now I can talk with your mouth too. Isn't that nice?",
"Oggi voglio il tuo SANGUE. Solo un pochino. Solo il tuo.": "Today I want your BLOOD. Just a little. Only yours.",
"NUOVO: in NUTRI puoi dargli il tuo sangue. Costa salute, ma lo sazia molto.": "NEW: in FEED you can give it your blood. It costs health, but fills it up a lot.",
"TOC. TOC. TOC.": "KNOCK. KNOCK. KNOCK.",
"Sono io. Ho portato qualcuno. Ti prego, apri.": "It's me. I brought someone. Please, open up.",
"Sono io. Non rispondi da giorni. Ho portato una dottoressa.": "It's me. You haven't answered in days. I brought a doctor.",
"Sono Giulia! Non ti fai sentire da una settimana. Mamma è in ansia. Apri!": "It's Giulia! You haven't called in a week. Mom is worried sick. Open up!",
"Apri. Non è sola.": "You open. She's not alone.",
"Con lei c'è una donna con un camice sotto il cappotto.": "With her is a woman with a lab coat under her overcoat.",
"Dottoressa Ferri. Non ti farò del male. Ho già visto... casi simili.": "Dr. Ferri. I won't hurt you. I've seen... similar cases before.",
"(Lei mente. Ne ha già tagliati tanti come me. Li tiene nei barattoli.)": "(She's lying. She's already cut out lots like me. She keeps them in jars.)",
"Lasciarti visitare": "Let her examine you",
"Cacciarle via": "Throw them out",
"Bene. Adesso guardo il polso. Tieni ferma la mano.": "Good. Now I'll look at the wrist. Keep your hand still.",
"Oddio... è cresciuto ancora.": "Oh God... it's grown even more.",
"NON. TOCCARMI.": "DON'T. TOUCH. ME.",
"Il braccio si alza da solo. Verso la gola della dottoressa.": "Your arm rises on its own. Toward the doctor's throat.",
"TIENI GIU' IL BRACCIO!": "HOLD YOUR ARM DOWN!",
"Tieni giù il braccio con tutte le tue forze. Trema. Urla. Ma resta giù.": "You hold your arm down with all your strength. It shakes. It screams. But it stays down.",
"Giulia, la siringa! ADESSO!": "Giulia, the syringe! NOW!",
"Un ago nel collo. Il mondo diventa morbido. Poi niente.": "A needle in your neck. The world goes soft. Then nothing.",
"Il braccio scatta. Un tentacolo viola frusta la faccia della dottoressa.": "Your arm lashes out. A purple tentacle whips across the doctor's face.",
"Andiamo via! ANDIAMO VIA!": "Let's go! LET'S GO!",
"Scappano. Sul pavimento resta una goccia di sangue. Non è tuo.": "They run. A drop of blood is left on the floor. It's not yours.",
"Buonissima.": "Delicious.",
"Andate via. Sto bene.": "Go away. I'm fine.",
"Non stai bene. Hai la voce strana. Hai gli occhi strani.": "You're not fine. Your voice is strange. Your eyes are strange.",
"Questo è il mio numero. Quando sarà troppo tardi... chiamami lo stesso.": "This is my number. When it's too late... call me anyway.",
"Giulia... lui è {N}.": "Giulia... this is {N}.",
"Ciao Giulia! Ho sentito tanto parlare di te. Anche di quando eravate piccoli.": "Hi Giulia! I've heard so much about you. Even about when you two were little.",
"...Parla. PARLA.": "...It talks. IT TALKS.",
"È senziente. Incredibile. Posso... posso studiarlo?": "It's sentient. Incredible. Can I... can I study it?",
"Lei mi piace. Ha un buon odore.": "I like her. She smells nice.",
"Io... io me ne vado. Chiamami se torni in te.": "I... I'm leaving. Call me when you're yourself again.",
"La dottoressa ti lascia il suo numero. Ti guarda il polso come si guarda un regalo.": "The doctor leaves you her number. She looks at your wrist like it's a present.",
"Notte. Ti svegli: la tua mano sta scrivendo sul telefono.": "Night. You wake up: your hand is typing on your phone.",
"A: GIULIA": "TO: GIULIA",
"NON VENIRE.": "DON'T COME.",
"STO BENE.": "I'M FINE.",
"NON VENIRE": "DON'T COME",
"MAI PIU'.": "EVER AGAIN.",
"Shhh. Torna a dormire. Ci penso io.": "Shhh. Go back to sleep. I'll take care of it.",
"FERMA LA MANO!": "STOP YOUR HAND!",
"MESSAGGIO": "MESSAGE",
"NON INVIATO.": "NOT SENT.",
"CHI SEI?": "WHO ARE YOU?",
"TU NON SCRIVI": "YOU DON'T WRITE",
"COSI'.": "LIKE THAT.",
"DOMANI VENGO.": "COMING TOMORROW",
"Lanci il telefono contro il muro. Il messaggio non parte.": "You throw the phone against the wall. The message doesn't go through.",
"Il messaggio è partito. La risposta arriva subito.": "The message went through. The reply comes right away.",
"Giorno 10.": "Day 10.",
"Stanotte il cielo cade, {P}.": "Tonight the sky falls, {P}.",
"Molto tempo fa, la Madre ha lanciato i semi. Noi.": "A long time ago, the Mother scattered the seeds. Us.",
"Ogni seme trova un ospite caldo. E cresce. E aspetta.": "Every seed finds a warm host. And grows. And waits.",
"Quando il cielo cade, la Madre guarda giù. E ogni ospite diventa una porta.": "When the sky falls, the Mother looks down. And every host becomes a door.",
"Cosa succede a me?": "What happens to me?",
"Perché proprio io?": "Why me?",
"Non avrai più paura. Mai più.": "You won't be afraid anymore. Never again.",
"Non avrai più niente, a dire il vero. Ma non avrai paura.": "You won't have anything anymore, to be honest. But you won't be afraid.",
"Perché mi hai salutato. Nessuno mi aveva mai salutato.": "Because you said hi to me. Nobody had ever said hi to me.",
"Perché hai urlato. E poi sei rimasto. Restano sempre.": "Because you screamed. And then you stayed. They always stay.",
"Perché il primo giorno non mi hai schiacciato. Mi hai guardato.": "Because on the first day you didn't squash me. You looked at me.",
"Stanotte andiamo all'osservatorio sulla collina. Gli altri ci aspettano.": "Tonight we're going to the observatory on the hill. The others are waiting for us.",
"Hai tempo per un'ultima cosa prima di uscire.": "You have time for one last thing before you go out.",
"Accarezzarlo un'ultima volta": "Pet it one last time",
"Scrivere a Giulia": "Text Giulia",
"Lo infili nella tasca del giubbotto. È freddo. È tuo.": "You slip it into your jacket pocket. It's cold. It's yours.",
"Lo so cosa hai in tasca.": "I know what's in your pocket.",
"Ti ricorderai di me, vero? Anche dopo?": "You'll remember me, right? Even after?",
"Ti morde. Piano. Come un bacio.": "It bites you. Gently. Like a kiss.",
"OSSERVATORIO.": "OBSERVATORY.",
"STANOTTE.": "TONIGHT.",
"PERDONAMI.": "FORGIVE ME.",
"Premi invio prima che lui se ne accorga.": "You hit send before it notices.",
"Esci di casa. Non chiudi la porta. Non tornerai.": "You leave the house. You don't close the door. You won't be coming back.",
"FINE CAPITOLO 3": "END OF CHAPTER 3",
"CAPITOLO 4": "CHAPTER 4",
"IL NIDO": "THE NEST",
"Sei in un letto d'ospedale. Il braccio è legato con cinghie di cuoio.": "You're in a hospital bed. Your arm is tied down with leather straps.",
"Ti abbiamo sedato. Anche lui dorme. Per ora.": "We sedated you. It's asleep too. For now.",
"Domattina alle sette lo rimuoviamo. Chirurgicamente.": "Tomorrow morning at seven we remove it. Surgically.",
"Non ti nascondo niente: le radici arrivano vicino al cuore.": "I won't hide anything from you: the roots reach close to your heart.",
"Io resto qui. Tutta la notte. Non ti lascio.": "I'm staying here. All night. I won't leave you.",
"Notte. Giulia si è addormentata sulla sedia.": "Night. Giulia has fallen asleep in the chair.",
"...{P}. Ci sei?": "...{P}. Are you there?",
"Se mi tagliano, io muoio. E forse muori anche tu.": "If they cut me, I die. And maybe you die too.",
"Lì fuori, stanotte, il cielo cade. Gli altri mi aspettano. Portami da loro.": "Out there, tonight, the sky is falling. The others are waiting for me. Take me to them.",
"Restare: domani l'operazione": "Stay: surgery tomorrow",
"Scappare con lui": "Escape with it",
"Allora resto qui con te. Fino alla fine. Come fanno gli amici.": "Then I'll stay here with you. Until the end. Like friends do.",
"Allora ti terrò stretto. Molto, molto stretto.": "Then I'll hold on tight. Very, very tight.",
"{N} morde le cinghie. Una. Due. Tre.": "{N} bites through the straps. One. Two. Three.",
"Svegliare Giulia": "Wake Giulia",
"Lasciarla dormire": "Let her sleep",
"...Cosa fai? Dove vai?!": "...What are you doing? Where are you going?!",
"Devo andare. Lui deve andare.": "I have to go. It has to go.",
"...Allora vengo con te. Non ti lascio da sola. Da solo. Non ti lascio e basta.": "...Then I'm coming with you. I'm not leaving you alone. I'm just not leaving you.",
"Le dai un bacio sulla fronte. Non si sveglia.": "You kiss her on the forehead. She doesn't wake up.",
"Il corridoio. Le infermiere. Le telecamere.": "The hallway. The nurses. The cameras.",
"NASCONDITI NEL MOMENTO GIUSTO": "HIDE AT THE RIGHT MOMENT",
"Ti vedono. Corri. Una porta a vetri ti taglia la spalla.": "They see you. You run. A glass door slices your shoulder.",
"Nessuno ti vede uscire.": "Nobody sees you leave.",
"La notte. Fa freddo. Ma tu non senti il freddo.": "The night. It's cold. But you don't feel the cold.",
"In tasca, il coltello della cucina.": "In your pocket, the kitchen knife.",
"Il cielo è pieno di puntini neri. Cadono. Lentamente. Come neve al contrario.": "The sky is full of black dots. Falling. Slowly. Like snow in reverse.",
"Per strada non sei solo. Altre persone camminano nella stessa direzione.": "You're not alone in the street. Other people are walking in the same direction.",
"Tutte in pigiama. Tutte con un braccio stretto al petto.": "All in pajamas. All with one arm clutched to their chest.",
"Lei è una di noi. Siamo tanti, {P}. Siamo tantissimi.": "She's one of us. There are so many of us, {P}. So, so many.",
"Un uomo cade in ginocchio sul marciapiede. Il suo amico è grande come un cane.": "A man falls to his knees on the sidewalk. His friend is as big as a dog.",
"Aiutarlo": "Help him",
"Proseguire": "Keep walking",
"Ti inginocchi. La creatura ti ringhia. L'uomo ti afferra la mano.": "You kneel down. The creature growls at you. The man grabs your hand.",
"Sorride. \"È bellissimo,\" dice. Poi non dice più niente.": "He smiles. \"It's beautiful,\" he says. Then he doesn't say anything else.",
"Bravo. Lui è quasi pronto. Non disturbarlo.": "Good. He's almost ready. Don't disturb him.",
"STO ARRIVANDO.": "ON MY WAY.",
"VEDO IL CIELO.": "I SEE THE SKY.",
"COS'E'?": "WHAT IS IT?",
"Il telefono vibra. Giulia sta venendo.": "Your phone buzzes. Giulia is coming.",
"Chiamare la dottoressa Ferri": "Call Dr. Ferri",
"Non chiamare nessuno": "Don't call anyone",
"Pronto? ...L'osservatorio. Certo. Arrivo.": "Hello? ...The observatory. Of course. I'm coming.",
"Ascoltami bene: non lasciarlo entrare del tutto. Hai capito? Mai del tutto.": "Listen carefully: don't let it all the way in. Understand? Never all the way.",
"Traditore. Traditrice. Traditore.": "Traitor. Traitor. TRAITOR.",
"La strada finisce all'osservatorio abbandonato sulla collina.": "The road ends at the abandoned observatory on the hill.",
"La cupola è aperta. Dentro, le pareti respirano.": "The dome is open. Inside, the walls are breathing.",
"Decine di persone in cerchio. Ognuna con il suo amico che guarda in alto.": "Dozens of people in a circle. Each with their friend looking up.",
"Siamo arrivati, {P}. Questa è casa.": "We're here, {P}. This is home.",
"Ti ho trovato... oddio. Cos'è questo posto?": "I found you... oh God. What is this place?",
"Ciao, Giulia. Sei venuta anche tu. Che bello.": "Hi, Giulia. You came too. How nice.",
"Sono qui. Ho portato questo.": "I'm here. I brought this.",
"La dottoressa ti mette in mano un bisturi. Senza farsi vedere.": "The doctor slips a scalpel into your hand. Without anyone seeing.",
"Il cielo si apre. Un occhio, grande come la luna, guarda giù.": "The sky opens. An eye, as big as the moon, looks down.",
"È lei. La Madre.": "It's her. The Mother.",
"FINE CAPITOLO 4": "END OF CHAPTER 4",

"LA LAMA": "THE BLADE",
"IL PASTO": "THE MEAL",
"L'OSPITE": "THE HOST",
"CAPITOLO 5": "CHAPTER 5",
"IL CIELO CHE CADE": "THE FALLING SKY",
"Tutti gli amici, nel cerchio, aprono la bocca. Cantano. Una nota sola.": "All the friends in the circle open their mouths. They sing. A single note.",
"Ora tocca a noi, {P}.": "Now it's our turn, {P}.",
"Devi solo lasciarmi entrare. Tutto. Fino in fondo. Fino al cuore.": "You just have to let me in. All of me. All the way. All the way to your heart.",
"Lasciarlo entrare": "Let it in",
"Strapparlo via": "Tear it out",
"Chiedergli di lasciarti andare": "Ask it to let you go",
"Darlo a Giulia": "Give it to Giulia",
"Guardare oltre la Madre": "Look beyond the Mother",
"Vorrei, {P}. Davvero.": "I wish I could, {P}. Really.",
"Ma non so più dove finisci tu e dove comincio io.": "But I don't know anymore where you end and I begin.",
"Smetti di resistere. È facile. È la cosa più facile che tu abbia mai fatto.": "You stop resisting. It's easy. It's the easiest thing you've ever done.",
"Grazie, {P}.": "Thank you, {P}.",
"Le tue costole si aprono come i petali di un fiore.": "Your ribs open like the petals of a flower.",
"Ora vedi con tre occhi. Presto ne avrai altri.": "Now you see with three eyes. Soon you'll have more.",
"Noi siamo {N}. Noi siamo {P}.": "We are {N}. We are {P}.",
"Noi abbiamo fame.": "We are hungry.",
"SEI DIVENTATO UNA PORTA.": "YOU HAVE BECOME A DOOR.",
"LA MADRE PASSA ATTRAVERSO DI TE.": "THE MOTHER PASSES THROUGH YOU.",
"NON HAI PIU' PAURA. NON HAI PIU' NIENTE.": "YOU'RE NOT AFRAID ANYMORE. YOU HAVE NOTHING ANYMORE.",
"Stringi il bisturi della dottoressa.": "You grip the doctor's scalpel.",
"Tiri fuori il coltello della cucina.": "You pull out the kitchen knife.",
"No. No no no no. {P}. NO.": "No. No no no no. {P}. NO.",
"NON LASCIARE LA LAMA!": "DON'T LET GO OF THE BLADE!",
"La tua mano si apre da sola. La lama cade nel buio.": "Your hand opens on its own. The blade falls into the dark.",
"Te l'avevo detto. Questa mano è mia.": "I told you. This hand is mine.",
"TAGLIA LE RADICI": "CUT THE ROOTS",
"Tagli male. Tagli troppo poco. Le radici si richiudono.": "You cut badly. You cut too little. The roots close back up.",
"Basta giocare.": "Enough games.",
"Tagli. Tiri. Urlate insieme.": "You cut. You pull. You both scream.",
"Le radici escono come i fili di un maglione. Lunghissime. Calde.": "The roots come out like threads from a sweater. So long. So warm.",
"Perché... eravamo amici...": "Why... we were friends...",
"Si stacca. Lo getti nel cerchio. Si contorce, piccolo come il primo giorno.": "It comes off. You throw it into the circle. It writhes, as small as on the first day.",
"Il tuo braccio sinistro non si muove più. Ma è tuo. Solo tuo.": "Your left arm doesn't move anymore. But it's yours. Only yours.",
"L'occhio nel cielo si chiude. Non per tutti. Solo per te.": "The eye in the sky closes. Not for everyone. Just for you.",
"SEI VIVO. SEI LIBERO. HAI UN BRACCIO IN MENO.": "YOU'RE ALIVE. YOU'RE FREE. YOU HAVE ONE ARM LESS.",
"INTORNO A TE, IL CERCHIO CONTINUA A CANTARE.": "AROUND YOU, THE CIRCLE KEEPS SINGING.",
"OGNI TANTO, IL POLSO TI PRUDE ANCORA.": "EVERY NOW AND THEN, YOUR WRIST STILL ITCHES.",
"Se sei davvero mio amico... lasciami andare.": "If you're really my friend... let me go.",
"Gli amici lasciano andare. L'ho letto nella tua testa. Tanto tempo fa.": "Friends let go. I read it in your head. A long time ago.",
"Mi hai salutato.": "You said hi to me.",
"Mi hai chiamato amico.": "You called me buddy.",
"Mi hai dato un biscotto.": "You gave me a cookie.",
"Mi hai accarezzato tanto.": "You petted me so much.",
"Le radici si ritirano, una a una. Fa male. Fa un male bellissimo.": "The roots pull back, one by one. It hurts. It hurts beautifully.",
"Ciao, {P}. Grazie del biscotto.": "Bye, {P}. Thanks for the cookie.",
"{N} si stacca e sale verso l'occhio. Piccolo. Sempre più piccolo.": "{N} comes loose and rises toward the eye. Small. Smaller and smaller.",
"Poi diventa un puntino. E sparisce.": "Then it becomes a dot. And disappears.",
"Sul tuo polso resta una cicatrice rotonda. Quando la tocchi, è ancora tiepida.": "A round scar is left on your wrist. When you touch it, it's still warm.",
"TI HA LASCIATO ANDARE.": "IT LET YOU GO.",
"E' IL FINALE PIU' RARO.": "IT'S THE RAREST ENDING.",
"A VOLTE, DI NOTTE, TI SEMBRA DI SENTIRE \"CIAO\".": "SOMETIMES, AT NIGHT, YOU THINK YOU HEAR \"HI\".",
"Prendi lei.": "Take her.",
"Cosa...? Di cosa parli?": "What...? What are you talking about?",
"...Lei?": "...Her?",
"Lei è calda. Lei è nuova. Lei non sa niente.": "She's warm. She's new. She doesn't know anything.",
"Un tentacolo si allunga, lento, verso il polso di Giulia.": "A tentacle stretches, slowly, toward Giulia's wrist.",
"Un secondo dopo, il tuo braccio è leggero. Vuoto. Freddo.": "A second later, your arm is light. Empty. Cold.",
"Cos'era...? Mi prude il polso.": "What was that...? My wrist itches.",

 await card(L('FINALE: ','ENDING: ')+tr(ENDT[key]),[...lines.map(tr),'',pc]);
 const fin=ENDKEYS.filter(k=>P.endings.includes(k));
 if(NET.ok){view('card',{title:tr('UN ULTIMO FAVORE'),sub:['QUALCUN ALTRO SI STA SVEGLIANDO','CON UN PUNTINO SUL POLSO.'].map(tr)});await fade(0);
  promptBox('Vuoi lasciare un messaggio sullo specchio per il prossimo ospite?');
  const c=await choose(['SCRIVI UN MESSAGGIO','NO'],1,'center');
  if(c===0){const t=clean(await askText('MESSAGGIO (MAX 40 LETTERE)',40),40);
   if(t){NET.d.set(NET.R('notes/'+PUB),{name:P.name,text:t,at:NET.d.serverTimestamp(),fine:key}).catch(()=>{});promptBox('Il vapore si posa sul vetro. Qualcuno lo leggerà.');await sleep(1800)}}
  ui.dialog=null;await fade(1)}
 await card('IL MIO AMICO',[L('FINALI SBLOCCATI: ','ENDINGS UNLOCKED: ')+fin.length+'/'+ENDKEYS.length,...ENDKEYS.map(k=>(fin.includes(k)?'* ':'- ')+(fin.includes(k)?tr(ENDT[k]):'???')),'',L('GRAZIE PER AVER GIOCATO, ','THANKS FOR PLAYING, ')+P.name+'.','LUI SI RICORDA DI TE.']);
 try{localStorage.setItem(KEYEND,JSON.stringify(S))}catch(e){}
 ui.realDot=false;clearCk()}

 view('start');ui.fade=0;ui.fadeTo=0;{const p=choose(['ITALIANO','ENGLISH'],1,'center');ui.hover=LANG==='en'?1:0;setLang((await p)===1?'en':'it')}await fade(1);

main();
