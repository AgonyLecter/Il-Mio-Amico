let AC=null,muted=false;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})}
function tone(f,d=.06,type='square',v=.04,slide=0){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function noise(d=.3,v=.2,lp=1200){if(!AC||muted)return;const t=AC.currentTime,b=AC.createBuffer(1,Math.floor(AC.sampleRate*d),AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;const g=AC.createGain();g.gain.value=v;s.connect(f).connect(g).connect(AC.destination);s.start(t)}

async function askName(){view('title');await fade(0);
 if(P.name){promptBox('Di nuovo tu, '+P.name+'?');if(await choose(['SÌ, SONO IO','CAMBIA NOME'],1,'center')===0){ui.dialog=null;return}}
 while(true){ui.dialog=null;const n=clean(await askText('COME TI CHIAMI?',12),12,true);if(n.length>=2){P.name=n;saveProfile(true);break}
  promptBox('Scrivi un nome vero. Almeno 2 lettere.');await sleep(1300)}
 promptBox('Piacere, '+P.name+'. Me lo ricorderò.');await sleep(1600);ui.glitch=.3;await sleep(300);ui.dialog=null}
async function main(){
 view('start');ui.fade=0;ui.fadeTo=0;await tap();await fade(1);
 while(true){let mode=await titleScreen();
  while(true){try{if(mode==='new'){await askName();P.plays++;inc('partite');if(P.plays===1)inc('ospiti');saveProfile(true);await fade(1);S=newState();await chapter1()}else S=getCk();await chapter2(mode==='ck');break}
   catch(e){if(!(e instanceof Over)){console.error(e);break}const r=await gameOver(e.k);if(r!=='retry')break;mode='ck'}}}}
netInit();
main();
</script>
